services:
  - type: web
    name: corex-script
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: corex-script-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/scripts.db
      - key: SESSION_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
        
